/* ================= LEVELS & XP ================= */

const MAX_LEVEL = 20;

// XP needed to go from `level` to `level + 1`. Level 1 -> 2 takes 100 XP (about 10 topics categorised).
const xpToNextLevel = (level) => 100 + (level - 1) * 10;

const getLevelInfo = (xp = 0) => {
  let level = 1;
  let remaining = xp;
  while (level < MAX_LEVEL && remaining >= xpToNextLevel(level)) {
    remaining -= xpToNextLevel(level);
    level++;
  }
  const needed = level < MAX_LEVEL ? xpToNextLevel(level) : 0;
  return {
    level,
    intoLevel: remaining,
    needed,
    pct: needed ? Math.round((remaining / needed) * 100) : 100,
    isMax: level >= MAX_LEVEL
  };
};

// Round-robin merge so every level unlocks a mix of item types
const interleave = (...lists) => {
  const out = [];
  const longest = Math.max(...lists.map(l => l.length));
  for (let i = 0; i < longest; i++) {
    lists.forEach(l => { if (l[i]) out.push(l[i]); });
  }
  return out;
};

// [id, name, desc, kind, colours, slot]
const toDefs = (rows, slot) => rows.map(([id, name, desc, kind, c]) => ({ id, name, desc, kind, c, slot }));

// The first item in each category is unlocked at Level 1, the rest are spread from Level 2 to MAX_LEVEL
const buildCategory = (category, defs) => {
  const cat = SHOP_CATEGORIES.find(c => c.id === category);
  return defs.map((def, i) => {
    const level = i === 0 ? 1 : 2 + Math.floor(((i - 1) * (MAX_LEVEL - 2)) / Math.max(1, defs.length - 2));
    const price = def.price !== undefined ? def.price : Math.round((cat.basePrice + level * 10) / 5) * 5;
    return { slot: category, ...def, category, level, price };
  });
};

const ITEM_BY_ID = Object.fromEntries(SHOP_ITEMS.map(item => [item.id, item]));

const isItemUnlocked = (item, level) => item.level <= level;

// Equip an item, replacing whatever was already in the same slot
const equipInSlot = (equippedIds, itemId) => {
  const item = ITEM_BY_ID[itemId];
  if (!item) return equippedIds;
  return [...equippedIds.filter(id => ITEM_BY_ID[id]?.slot !== item.slot), itemId];
};

const getEquippedBySlot = (equippedIds = []) => {
  const bySlot = {};
  equippedIds.forEach(id => {
    const item = ITEM_BY_ID[id];
    if (item) bySlot[item.slot] = item;
  });
  return bySlot;

// Estimate XP for students who were already using the app before levels existed
const estimateXpFromProgress = (progress = {}) => Object.values(progress).reduce((total, p) => {
  if (!p || !p.status || p.status === 'unassessed') return total;
  let xp = XP_REWARDS.firstAssessment;
  if (p.status === 'orange') xp += XP_REWARDS.redToOrange;
  if (p.status === 'green') xp += XP_REWARDS.redToGreen;
  if (p.notes) xp += XP_REWARDS.notes;
  return total + xp;
}, 0);

/* ================= DRAWING HELPERS ================= */

const starPoints = (cx, cy, R, r, n = 5) => Array.from({ length: n * 2 }, (_, i) => {
  const a = (Math.PI / n) * i - Math.PI / 2;
  const rad = i % 2 === 0 ? R : r;
  return `${(cx + rad * Math.cos(a)).toFixed(1)},${(cy + rad * Math.sin(a)).toFixed(1)}`;
}).join(' ');

const hexPoints = (cx, cy, r) => Array.from({ length: 6 }, (_, i) => {
  const a = (Math.PI / 3) * i;
  return `${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a) * 0.6).toFixed(1)}`;
}).join(' ');

const heartPath = (cx, cy, s) =>
  `M ${cx} ${cy + s} C ${cx - 1.6 * s} ${cy - 0.2 * s}, ${cx - 0.6 * s} ${cy - 1.3 * s}, ${cx} ${cy - 0.4 * s} ` +
  `C ${cx + 0.6 * s} ${cy - 1.3 * s}, ${cx + 1.6 * s} ${cy - 0.2 * s}, ${cx} ${cy + s} Z`;

const Flower = ({ cx, cy, r, petal, centre }) => (
  <g>
    {[0, 72, 144, 216, 288].map(deg => {
      const a = (deg * Math.PI) / 180;
      return <circle key={deg} cx={cx + r * Math.cos(a)} cy={cy + r * Math.sin(a)} r={r * 0.85} fill={petal} />;
    })}
    <circle cx={cx} cy={cy} r={r * 0.7} fill={centre} />
  </g>
);

// Points along a quadratic curve, used for necklaces and garlands
const curvePoints = (x0, y0, cx, cy, x1, y1, n) => Array.from({ length: n }, (_, i) => {
  const t = i / (n - 1);
  return {
    x: (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * cx + t * t * x1,
    y: (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * cy + t * t * y1
  };
});

const Mirror = ({ children }) => (
  <g>
    {children}
    <g transform="translate(200 0) scale(-1 1)">{children}</g>
  </g>
);

const WallFrame = ({ item }) => {

      className="border-4 px-3 py-2 rounded-xl shadow-lg font-serif font-black text-xs whitespace-nowrap"

const CeilingDecor = ({ item }) => {
  if (item.kind === 'lights') {
    return (
      <div className="flex justify-around items-center px-4">
        {item.c.map((col, i) => (
          <span
            key={i}
            className={`w-3 h-3 rounded-full ${i % 2 === 0 ? 'animate-ping' : 'animate-pulse'}`}
            style={{ background: col, boxShadow: `0 0 8px ${col}` }}
          />
        ))}
      </div>
    );
  }
  const flags = 12;
  return (
    <svg viewBox="0 0 300 30" preserveAspectRatio="none" className="w-full h-7">
      <path d="M 0 3 Q 150 14 300 3" stroke="#78350f" strokeWidth="1.2" fill="none" />
      {Array.from({ length: flags }, (_, i) => {
        const t = (i + 0.5) / flags;
        const x = t * 300;
        const y = 3 + 4 * (1 - (2 * t - 1) * (2 * t - 1)) * 2.75;
        if (item.kind === 'starGarland') {
          return <polygon key={i} points={starPoints(x, y + 6, 6, 2.6)} fill={item.c[0]} className={i % 2 ? 'animate-pulse' : ''} />;
        }
        return <polygon key={i} points={`${x - 9},${y} ${x + 9},${y} ${x},${y + 16}`} fill={item.c[i % item.c.length]} />;
      })}
    </svg>
  );
};

function PetRoom({ petData, equippedOverride = null, wallpaperOverride = null, dyeOverride = null }) {
  const equipped = equippedOverride || petData.equipped;
  const wallpaper = ITEM_BY_ID[wallpaperOverride || petData.wallpaper] || ITEM_BY_ID['wp_cozy'];
  const dye = dyeOverride || petData.dye || 'dye_default';
  const bySlot = getEquippedBySlot(equipped);

  const svgFor = (renderers, slot, viewBox) => {
    const item = bySlot[slot];
    if (!item || !renderers[item.kind]) return null;
    return <svg viewBox={viewBox} className="w-full h-full overflow-visible">{renderers[item.kind](item.c)}</svg>;
  };

  return (
    <div
      className="relative w-full h-[380px] rounded-3xl overflow-hidden border-4 shadow-xl"
      style={{ background: wallpaper.bg, borderColor: wallpaper.border }}
    >
      {/* Wallpaper Pattern & Atmosphere Effects */}
      {wallpaper.pattern && <div className="absolute inset-0 pointer-events-none" style={WALL_PATTERNS[wallpaper.pattern]} />}
      {wallpaper.glow === 'space' && (
        <div className="absolute inset-0 opacity-40 pointer-events-none bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-300 via-purple-500 to-transparent" />
      )}
      {wallpaper.glow === 'disco' && (
        <div className="absolute inset-0 opacity-30 pointer-events-none bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-cyan-400 via-fuchsia-500 to-transparent animate-pulse" />
      )}

      {/* Floor */}
      <div
        className="absolute bottom-0 inset-x-0 h-24 border-t-2 border-black/10"
        style={{ background: wallpaper.floor || 'rgba(69,26,3,0.2)' }}
      />

      {/* Ceiling Decorations */}
      {bySlot.wall_top && (
        <div className="absolute top-1 left-0 right-0 z-10">
          <CeilingDecor item={bySlot.wall_top} />
        </div>
      )}

      {/* Framed Wall Art */}
      {bySlot.wall && (
        <div className="absolute top-5 left-4 z-10">
          <WallFrame item={bySlot.wall} />
        </div>
      )}

      {/* Room Title Badge */}
      <div className="absolute top-4 right-4 z-20 bg-black/40 backdrop-blur-md text-white font-black text-xs px-3 py-1 rounded-full border border-white/20">
        {petData.name}'s Room
      </div>

      {/* Wall Decor (right) */}
      {bySlot.wall_right && (
        <div className="absolute top-14 right-6 z-10 w-16 h-16">
          {svgFor(WALL_RIGHT_RENDERERS, 'wall_right', '0 0 64 64')}
        </div>
      )}

      {/* Rug (directly underneath pet) */}
      {bySlot.rug && (
        <div className="absolute bottom-[38px] left-1/2 -translate-x-1/2 w-56 h-16 z-10">
          {svgFor(RUG_RENDERERS, 'rug', '0 0 220 64')}
        </div>
      )}

      {/* Corner Furniture */}
      {bySlot.furniture_left && (
        <div className="absolute bottom-6 left-3 w-16 h-24 z-20">
          {svgFor(LEFT_RENDERERS, 'furniture_left', '0 0 60 96')}
        </div>
      )}
      {bySlot.furniture_right && (
        <div className="absolute bottom-6 right-3 w-20 h-24 z-20">
          {svgFor(RIGHT_RENDERERS, 'furniture_right', '0 0 80 96')}
        </div>
      )}

      {/* Pet Avatar */}
      <div className="absolute bottom-10 left-1/2 -translate-x-1/2 z-30">
        <PetAvatar species={petData.species} equipped={equipped} dye={dye} className="w-48 h-48" />
      </div>

      {/* Toy (resting beside the pet) */}
      {bySlot.floor_extra && (
        <div className="absolute bottom-10 z-40 w-8 h-8" style={{ left: 'calc(50% - 82px)' }}>
          {svgFor(TOY_RENDERERS, 'floor_extra', '0 0 32 32')}
        </div>
      )}
    </div>
  );
}

// Small colour preview shown on shop cards
const ItemSwatch = ({ item }) => {
  if (item.category === 'wallpaper') {

      </div>
    );
  }
  return null;
};

function App() { 

  const [authSession, setAuthSession] = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [authMode, setAuthMode] = useState('signin');
  const [authEmail, setAuthEmail] = useState('');
  const [authPassword, setAuthPassword] = useState('');
  const [authMessage, setAuthMessage] = useState('');
  const [authBusy, setAuthBusy] = useState(false);
  const [signOutBusy, setSignOutBusy] = useState(false);
  const [cloudReadyUser, setCloudReadyUser] = useState(null);
  const [cloudLoadError, setCloudLoadError] = useState('');
  const [cloudSaveError, setCloudSaveError] = useState('');
  const [cloudLoadAttempt, setCloudLoadAttempt] = useState(0);
  const [cloudStatus, setCloudStatus] = useState('');

  const [studentName, setStudentName] = useState(() => { 

    return localStorage.getItem('maths_revision_student_name') || 'Year 11 Student'; 

  }); 

  const [isEditingName, setIsEditingName] = useState(false); 

 

  // Map of topicId -> { status: 'green'|'orange'|'red'|'unassessed', score: number, notes: string, lastTested: string } 

  const [progress, setProgress] = useState(() => { 

    const saved = localStorage.getItem('maths_revision_progress'); 

    return saved ? JSON.parse(saved) : {}; 

  }); 

 

  // Pet Companion, Inventory & Equipped Items State 

  const [petData, setPetData] = useState(() => {
    const saved = localStorage.getItem('maths_revision_pet');
    if (saved) {
      const parsed = JSON.parse(saved);
      let savedProgress = {};
      try {
        savedProgress = JSON.parse(localStorage.getItem('maths_revision_progress') || '{}');
      } catch (e) {}
      // Ensure persistent inventory array exists, keep one item per slot, and give XP for earlier revision
      return {
        ...parsed,
        inventory: parsed.inventory || parsed.equipped || [...STARTER_INVENTORY],
        equipped: (parsed.equipped || STARTER_EQUIPPED).reduce((list, id) => equipInSlot(list, id), []),
        wallpaper: parsed.wallpaper || 'wp_cozy',
        dye: parsed.dye || 'dye_default',
        xp: typeof parsed.xp === 'number' ? parsed.xp : estimateXpFromProgress(savedProgress)
      };
    }
    return {
      name: 'Pi',
      species: 'cat',
      dye: 'dye_default',
      wallpaper: 'wp_cozy',
      inventory: [...STARTER_INVENTORY],
      equipped: [...STARTER_EQUIPPED],
      coins: 150,
      xp: 0
    };
  });

  const [hasOnboarded, setHasOnboarded] = useState(() => { 

    return localStorage.getItem('maths_revision_onboarded') === 'true'; 

  }); 

 

  // Navigation tab state: 'revise' | 'pet' | 'shop' 

  const [activeTab, setActiveTab] = useState('revise'); 

 

  // Shop Category Filter & Live Item Fitting Room Preview 

  const [shopCategory, setShopCategory] = useState('all'); 

  const [previewItem, setPreviewItem] = useState(null); 

 

  // Coin Toast Notification 

  const [toast, setToast] = useState({ show: false, text: '', coins: 0, xp: 0 });
  const toastTimer = useRef(null);

  // Level-up celebration popup
  const [levelUp, setLevelUp] = useState(null);

  // Shop option to hide items that are still locked
  const [hideLocked, setHideLocked] = useState(false); 

 

  // Onboarding draft state 

  const [draftStudentName, setDraftStudentName] = useState(studentName); 

  const [draftPetName, setDraftPetName] = useState(petData.name); 

  const [draftSpecies, setDraftSpecies] = useState(petData.species); 

 

  // UI Revision filtering state 

  const [selectedStrand, setSelectedStrand] = useState('All'); 

  const [selectedStatus, setSelectedStatus] = useState('All'); 

  const [searchQuery, setSearchQuery] = useState(''); 

  const [showGuide, setShowGuide] = useState(true); 

   

  // Modal state for testing a topic 

  const [activeModalTopic, setActiveModalTopic] = useState(null); 

  const [modalScore, setModalScore] = useState(null); 

  const [modalNotes, setModalNotes] = useState(''); 

  const [copiedClip, setCopiedClip] = useState(false); 

 

  useEffect(() => { 

    localStorage.setItem('maths_revision_progress', JSON.stringify(progress)); 

  }, [progress]); 

 

  useEffect(() => { 

    localStorage.setItem('maths_revision_student_name', studentName); 

  }, [studentName]); 

 

  useEffect(() => { 

    localStorage.setItem('maths_revision_pet', JSON.stringify(petData)); 

  }, [petData]); 

 

  useEffect(() => { 

    localStorage.setItem('maths_revision_onboarded', hasOnboarded ? 'true' : 'false'); 

  }, [hasOnboarded]); 

 

  useEffect(() => {
    let active = true;
    const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, session) => {
      if (active) setAuthSession(session);
    });

    supabaseClient.auth.getSession().then(({ data, error }) => {
      if (!active) return;
      if (error) setAuthMessage(error.message);
      setAuthSession(data?.session || null);
      setAuthReady(true);
    }).catch(error => {
      if (!active) return;
      setAuthMessage(error.message || 'Could not connect to sign-in. Please try again.');
      setAuthReady(true);
    });

    return () => {
      active = false;
      subscription.unsubscribe();
    };
  }, []);

  const userId = authSession?.user?.id;

  useEffect(() => {
    if (!userId) {
      setCloudReadyUser(null);
      setCloudStatus('');
      return;
    }

    let cancelled = false;
    setCloudReadyUser(null);
    setCloudLoadError('');
    setCloudStatus('Loading saved progress...');

    const loadCloudData = async () => {
      const { data, error } = await supabaseClient
        .from('student_data')
        .select('student_name, progress, pet_data')
        .eq('user_id', userId)
        .maybeSingle();

      if (cancelled) return;
      if (error) {
        setCloudLoadError(error.message);
        return;
      }

      if (data) {
        const savedPetData = data.pet_data || {};
        const { hasOnboarded: savedOnboarded, ...savedPet } = savedPetData;
        const savedStudentName = data.student_name || 'Year 11 Student';

        setStudentName(savedStudentName);
        setProgress(data.progress || {});
        setHasOnboarded(savedOnboarded === true);
        setDraftStudentName(savedStudentName);
        setDraftPetName(savedPet.name || 'Pi');
        setDraftSpecies(savedPet.species || 'cat');
        setPetData(previous => ({
          ...previous,
          ...savedPet,
          inventory: savedPet.inventory || previous.inventory,
          equipped: (savedPet.equipped || previous.equipped || STARTER_EQUIPPED)
            .reduce((items, itemId) => equipInSlot(items, itemId), [])
        }));
      }

      setCloudReadyUser(userId);
      setCloudStatus(data ? 'Saved to cloud' : 'Saving to cloud...');
    };

    loadCloudData().catch(error => {
      if (!cancelled) setCloudLoadError(error.message || 'Could not load your saved progress.');
    });

    return () => {
      cancelled = true;
    };
  }, [userId, cloudLoadAttempt]);

  useEffect(() => {
    if (!userId || cloudReadyUser !== userId) return;

    const saveTimeout = setTimeout(async () => {
      setCloudStatus('Saving...');
      setCloudSaveError('');
      const { error } = await supabaseClient.from('student_data').upsert({
        user_id: userId,
        student_name: studentName,
        progress,
        pet_data: { ...petData, hasOnboarded },
        updated_at: new Date().toISOString()
      }, { onConflict: 'user_id' });

      if (error) {
        setCloudSaveError(error.message);
        setCloudStatus('Cloud save failed');
      } else {
        setCloudStatus('Saved to cloud');
      }
    }, 700);

    return () => clearTimeout(saveTimeout);
  }, [userId, cloudReadyUser, studentName, progress, petData, hasOnboarded]);

  const handleAuthSubmit = async (event) => {
    event.preventDefault();
    setAuthBusy(true);
    setAuthMessage('');

    try {
      if (authMode === 'signup') {
        const { data, error } = await supabaseClient.auth.signUp({
          email: authEmail.trim(),
          password: authPassword,
          options: { emailRedirectTo: window.location.origin }
        });
        if (error) throw error;
        if (!data.session) {
          setAuthMessage('Account created. Check your email for the confirmation link, then return here to sign in.');
        } else {
          setAuthSession(data.session);
        }
      } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: authEmail.trim(),
          password: authPassword
        });
        if (error) throw error;
        setAuthSession(data.session);
      }
      setAuthPassword('');
    } catch (error) {
      setAuthMessage(error.message || 'Sign-in failed. Please try again.');
    } finally {
      setAuthBusy(false);
    }
  };

  const handleSignOut = async () => {
    setSignOutBusy(true);
    setCloudStatus('Saving...');

    const { error: saveError } = await supabaseClient.from('student_data').upsert({
      user_id: userId,
      student_name: studentName,
      progress,
      pet_data: { ...petData, hasOnboarded },
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id' });

    if (saveError) {
      setCloudSaveError(saveError.message);
      setCloudStatus('Save failed; still signed in');
      setSignOutBusy(false);
      return;
    }

    const { error } = await supabaseClient.auth.signOut();
    if (error) {
      setCloudStatus('Sign out failed');
      setSignOutBusy(false);
      return;
    }

    ['maths_revision_progress', 'maths_revision_student_name', 'maths_revision_pet', 'maths_revision_onboarded']
      .forEach(key => localStorage.removeItem(key));
    window.location.reload();
  };

  const levelInfo = getLevelInfo(petData.xp || 0);

  const showRewardToast = (text, coinsEarned, xpEarned) => {
    setToast({ show: true, text, coins: coinsEarned, xp: xpEarned });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => {
      setToast({ show: false, text: '', coins: 0, xp: 0 });
    }, 3000);
  };

  // Award coins and XP together, celebrating any level-ups along the way
  const addRewards = (coins, xp, reason) => {
    if (coins <= 0 && xp <= 0) return;
    const oldLevel = getLevelInfo(petData.xp || 0).level;
    const newLevel = getLevelInfo((petData.xp || 0) + xp).level;
    const bonus = (newLevel - oldLevel) * LEVEL_UP_BONUS_COINS;
    setPetData(prev => ({ ...prev, coins: prev.coins + coins + bonus, xp: (prev.xp || 0) + xp }));
    showRewardToast(reason, coins, xp);
    if (newLevel > oldLevel) {
      setLevelUp({
        level: newLevel,
        bonus,
        unlocked: SHOP_ITEMS.filter(item => item.level > oldLevel && item.level <= newLevel)
      });
    }
  };

  const totalTopics = ALL_TOPICS.length; 

  let greenCount = 0; 

  let orangeCount = 0; 

  let redCount = 0; 

  let unassessedCount = 0; 

 

  ALL_TOPICS.forEach(topic => { 

    const status = progress[topic.id]?.status || 'unassessed'; 

    if (status === 'green') greenCount++; 

    else if (status === 'orange') orangeCount++; 

    else if (status === 'red') redCount++; 

    else unassessedCount++; 

  }); 

 

  const greenPct = Math.round((greenCount / totalTopics) * 100); 

  const orangePct = Math.round((orangeCount / totalTopics) * 100); 

  const redPct = Math.round((redCount / totalTopics) * 100); 

  const assessedCount = greenCount + orangeCount + redCount; 

 

  const finishOnboarding = () => { 

    if (!draftStudentName.trim() || !draftPetName.trim()) { 

      alert('Please enter both your name and a name for your pet!'); 

      return; 

    } 

    setStudentName(draftStudentName.trim()); 

    setPetData(prev => ({ 

      ...prev, 

      name: draftPetName.trim(), 

      species: draftSpecies 

    })); 

    setHasOnboarded(true); 

  }; 

 

  const openDiagnosticModal = (topic) => { 

    const currentProg = progress[topic.id] || {}; 

    setActiveModalTopic(topic); 

    setModalScore(currentProg.score !== undefined ? currentProg.score : null); 

    setModalNotes(currentProg.notes || ''); 

    setCopiedClip(false); 

  }; 

 

  const closeModal = () => { 

    setActiveModalTopic(null); 

    setModalScore(null); 

    setModalNotes(''); 

  }; 

 

  const copyClipNumber = (clip) => { 

    navigator.clipboard.writeText(clip); 

    setCopiedClip(true); 

    setTimeout(() => setCopiedClip(false), 2000); 

  }; 

 

  const saveTopicAssessment = (forcedStatus = null) => { 

    if (!activeModalTopic) return; 

 

    const oldProg = progress[activeModalTopic.id] || {}; 

    const oldStatus = oldProg.status || 'unassessed'; 

 

    let finalStatus = 'unassessed'; 

    let finalScore = modalScore; 

 

    if (forcedStatus) { 

      finalStatus = forcedStatus; 

      if (forcedStatus === 'green') finalScore = 5; 

      else if (forcedStatus === 'orange') finalScore = 3; 

      else if (forcedStatus === 'red') finalScore = 1; 

    } else if (modalScore !== null) { 

      if (modalScore === 5) finalStatus = 'green'; 

      else if (modalScore >= 3) finalStatus = 'orange'; 

      else finalStatus = 'red'; 

    } else { 

      alert('Please select a score from 0 to 5, or tap one of the traffic light buttons.'); 

      return; 

    } 

 

    let coinReward = 0;
    let xpReward = 0;
    let rewardReason = '';
    const today = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });

    if (oldStatus === 'unassessed' && finalStatus !== 'unassessed') {
      coinReward = 50;
      xpReward = XP_REWARDS.firstAssessment;
      rewardReason = 'Assessed topic for the first time!';
    } else if (oldStatus === 'red' && finalStatus === 'orange') {
      coinReward = 50;
      xpReward = XP_REWARDS.redToOrange;
      rewardReason = 'Upgraded Red topic to Orange!';
    } else if (oldStatus === 'red' && finalStatus === 'green') {
      coinReward = 100;
      xpReward = XP_REWARDS.redToGreen;
      rewardReason = 'Upgraded Red topic directly to Green!';
    } else if (oldStatus === 'orange' && finalStatus === 'green') {
      coinReward = 50;
      xpReward = XP_REWARDS.orangeToGreen;
      rewardReason = 'Mastered topic (Orange ➡️ Green)!';
    } else if (oldProg.lastTested !== today) {
      // Spaced-repetition re-test (XP only, once per topic per day)
      xpReward = XP_REWARDS.retest;
      rewardReason = 'Re-tested a topic to keep it fresh!';
    }

    if (modalNotes.trim() && !oldProg.notes) {
      coinReward += 10;
      xpReward += XP_REWARDS.notes;
      rewardReason += ' (+10 for adding notes)';
    }

    addRewards(coinReward, xpReward, rewardReason.trim());

    setProgress(prev => ({ 

      ...prev, 

      [activeModalTopic.id]: { 

        status: finalStatus, 

        score: finalScore, 

        notes: modalNotes, 

        lastTested: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) 

      } 

    })); 

 

    closeModal(); 

  }; 

 

  /* Persistent Inventory & Equip Toggling Logic */
  const toggleEquipItem = (itemId) => {
    const item = ITEM_BY_ID[itemId];
    if (!item) return;

    setPetData(prev => {
      // If equipping a wallpaper or dye, swap it specifically
      if (item.category === 'wallpaper') {
        const isEquipped = prev.wallpaper === itemId;
        return { ...prev, wallpaper: isEquipped ? 'wp_cozy' : itemId };
      }
      if (item.category === 'dye') {
        const isEquipped = prev.dye === itemId;
        return { ...prev, dye: isEquipped ? 'dye_default' : itemId };
      }

      // Wearables & furniture: one item per slot, so equipping swaps out the old one
      const isEquipped = prev.equipped.includes(itemId);
      const newEquipped = isEquipped
        ? prev.equipped.filter(id => id !== itemId)
        : equipInSlot(prev.equipped, itemId);
      return { ...prev, equipped: newEquipped };
    });
  };

  const buyItem = (item) => {
    if (!isItemUnlocked(item, levelInfo.level)) {
      alert(`This item unlocks at Level ${item.level}. Keep revising to earn XP!`);
      return;
    }
    if (petData.coins < item.price) {
      alert('Not enough coins! Complete GCSE revision diagnostics to earn more.');

    }));

                          topic.strand.toLowerCase().includes(searchQuery.toLowerCase());

                            className={`w-full py-2.5 font-black text-xs rounded-2xl transition flex items-center justify-center space-x-1.5 ${
                              canAfford
                                ? 'bg-slate-900 hover:bg-slate-800 text-white shadow'
                                : 'bg-slate-100 text-slate-400 cursor-not-allowed'
                            }`}
                          >
                            <span>{canAfford ? `Buy for ${item.price} Coins` : 'Need More Coins'}</span>
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>
        )}

      </main> 

 

      {/* Assessment Modal */} 

      {activeModalTopic && ( 

        <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto"> 

          <div  

            className="bg-white rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl border border-slate-200 space-y-6 my-8" 

            onClick={(e) => e.stopPropagation()} 

          > 

            <div className="flex items-start justify-between border-b border-slate-100 pb-4"> 

              <div> 

                <span className="text-xs font-bold uppercase tracking-wider text-amber-600 bg-amber-50 border border-amber-200 px-3 py-1 rounded-full"> 

                  {activeModalTopic.strand} • Clip {activeModalTopic.clip} 

                </span> 

                <h2 className="text-2xl font-black text-slate-900 mt-2">{activeModalTopic.name}</h2> 

              </div> 

              <button  

                onClick={closeModal} 

                className="p-2 rounded-2xl bg-slate-100 text-slate-500 hover:bg-slate-200 transition" 

              > 

                ✕ 

              </button> 

            </div> 

 

            <div className="bg-slate-900 text-white rounded-2xl p-5 space-y-3 shadow-md"> 

              <div className="flex items-center justify-between"> 

                <span className="text-xs font-bold text-amber-400 uppercase tracking-wider">Step 1: MathsWatch Diagnostic</span> 

                <button 

                  onClick={() => copyClipNumber(activeModalTopic.clip)} 

                  className="px-3 py-1 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs flex items-center space-x-1.5 transition" 

                > 

                  {copiedClip ? <Check className="w-3.5 h-3.5" /> : <Copy className="w-3.5 h-3.5" />} 

                  <span>{copiedClip ? 'Copied Clip #' : `Copy Clip ${activeModalTopic.clip}`}</span> 

                </button> 

              </div> 

 

              <p className="text-xs text-slate-300 leading-relaxed"> 

                Open <strong>MathsWatch (vle.mathswatch.co.uk)</strong>, search for <strong>Clip {activeModalTopic.clip}</strong>, and attempt <strong>3 standard questions</strong> and <strong>2 hard questions</strong>. 

              </p> 

            </div> 

 

            <div className="space-y-3"> 

              <label className="block text-xs font-black uppercase tracking-wider text-slate-500"> 

                Step 2: How many questions did you get correct out of 5? 

              </label> 

 

              <div className="grid grid-cols-6 gap-2"> 

                {[0, 1, 2, 3, 4, 5].map((scoreNum) => { 

                  let colorClass = "bg-slate-100 text-slate-800 hover:bg-slate-200 border-slate-200"; 

                  if (modalScore === scoreNum) { 

                    if (scoreNum === 5) colorClass = "bg-emerald-500 text-white border-emerald-600 font-black"; 

                    else if (scoreNum >= 3) colorClass = "bg-amber-500 text-white border-amber-600 font-black"; 

                    else colorClass = "bg-rose-500 text-white border-rose-600 font-black"; 

                  } 

 

                  return ( 

                    <button 

                      key={scoreNum} 

                      onClick={() => setModalScore(scoreNum)} 

                      className={`p-3 rounded-2xl border-2 text-center text-sm font-bold transition-all ${colorClass}`} 

                    > 

                      {scoreNum}/5 

                    </button> 

                  ); 

                })} 

              </div> 

            </div> 

 

            {modalScore !== null && ( 

              <div className="p-4 rounded-2xl border-2 space-y-2 animate-fadeIn"> 

                {modalScore === 5 && ( 

                  <div className="bg-emerald-50 border-emerald-200 text-emerald-900 p-4 rounded-xl space-y-2"> 

                    <div className="flex items-center space-x-2 font-black text-sm text-emerald-700"> 

                      <CheckCircle2 className="w-5 h-5" /> 

                      <span>🟢 Categorised as GREEN (Mastered)</span> 

                    </div> 

                    <p className="text-xs text-emerald-800 leading-relaxed"> 

                      <strong>Action Plan:</strong> Perfect score! Park this topic for 2 to 3 weeks. Return later for a quick spaced-repetition check to ensure you retain it for your exams. 

                    </p> 

                  </div> 

                )} 

 

                {modalScore >= 3 && modalScore <= 4 && ( 

                  <div className="bg-amber-50 border-amber-200 text-amber-900 p-4 rounded-xl space-y-2"> 

                    <div className="flex items-center space-x-2 font-black text-sm text-amber-700"> 

                      <AlertCircle className="w-5 h-5" /> 

                      <span>🟠 Categorised as ORANGE (Targeted Practice)</span> 

                    </div> 

                    <p className="text-xs text-amber-800 leading-relaxed"> 

                      <strong>Action Plan:</strong> You understand the basics, but missed a couple of questions. Watch the key example clips on MathsWatch Clip {activeModalTopic.clip} or CorbettMaths, do 5 targeted practice questions on weak areas, and re-test! 

                    </p> 

                  </div> 

                )} 

 

                {modalScore <= 2 && ( 

                  <div className="bg-rose-50 border-rose-200 text-rose-900 p-4 rounded-xl space-y-2"> 

                    <div className="flex items-center space-x-2 font-black text-sm text-rose-700"> 

                      <XCircle className="w-5 h-5" /> 

                      <span>🔴 Categorised as RED (Action Required)</span> 

                    </div> 

                    <p className="text-xs text-rose-800 leading-relaxed"> 

                      <strong>Action Plan:</strong>  

                      <ol className="list-decimal pl-4 mt-1 space-y-1"> 

                        <li>Watch the full instructional video on MathsWatch Clip {activeModalTopic.clip}.</li> 

                        <li>Copy 2 worked examples clearly into your revision notebook.</li> 

                        <li>Attempt textbook / CorbettMaths practice questions.</li> 

                        <li>Re-test when ready to move this topic to Orange or Green!</li> 

                      </ol> 

                    </p> 

                  </div> 

                )} 

              </div> 

            )} 

 

            <div className="space-y-2"> 

              <span className="block text-[11px] font-bold text-slate-400 uppercase tracking-wider"> 

                Or set status directly: 

              </span> 

              <div className="grid grid-cols-3 gap-2"> 

                <button 

                  onClick={() => saveTopicAssessment('green')} 

                  className="py-2.5 px-3 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs flex items-center justify-center space-x-1.5 shadow-sm transition" 

                > 

                  <CheckCircle2 className="w-4 h-4" /> 

                  <span>Set Green</span> 

                </button> 

 

                <button 

                  onClick={() => saveTopicAssessment('orange')} 

                  className="py-2.5 px-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs flex items-center justify-center space-x-1.5 shadow-sm transition" 

                > 

                  <AlertCircle className="w-4 h-4" /> 

                  <span>Set Orange</span> 

                </button> 

 

                <button 

                  onClick={() => saveTopicAssessment('red')} 

                  className="py-2.5 px-3 rounded-xl bg-rose-500 hover:bg-rose-600 text-white font-bold text-xs flex items-center justify-center space-x-1.5 shadow-sm transition" 

                > 

                  <XCircle className="w-4 h-4" /> 

                  <span>Set Red</span> 

                </button> 

              </div> 

            </div> 

 

            <div className="space-y-2 pt-2 border-t border-slate-100"> 

              <label className="block text-xs font-bold text-slate-700 flex items-center space-x-1.5"> 

                <StickyNote className="w-4 h-4 text-amber-500" /> 

                <span>My Personal Topic Notes / Key Formulas to Remember:</span> 

              </label> 

              <textarea 

                value={modalNotes} 

                onChange={(e) => setModalNotes(e.target.value)} 

                placeholder="Write reminders here (e.g. 'Remember to reverse inequality sign when dividing by negative number')..." 

                className="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-medium focus:outline-none focus:border-amber-500 h-20 resize-none" 

              /> 

            </div> 

 

            <div className="flex items-center justify-end space-x-3 pt-2"> 

              <button 

                onClick={closeModal} 

                className="px-5 py-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition" 

              > 

                Cancel 

              </button> 

              <button 

                onClick={() => saveTopicAssessment()} 

                className="px-6 py-2.5 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-black text-xs shadow-md transition" 

              > 

                Save Progress & Earn Coins 

              </button> 

            </div> 

 

          </div> 

        </div> 

      )} 

 

      {/* Footer */} 

      <footer className="bg-slate-900 text-slate-400 text-xs py-6 border-t border-slate-800"> 

        <div className="max-w-7xl mx-auto px-4 text-center space-y-2"> 

          <p className="font-semibold text-slate-300">Year 11 GCSE Higher Maths Revision Companion</p> 

          <p className="text-[11px] text-slate-500">Designed for Grade 7+ Target Students • Follow the algorithm, clear the Reds, turn everything Green!</p> 

        </div> 

      </footer> 

 

    </div> 

  ); 

} 

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
